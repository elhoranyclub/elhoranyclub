{% extends "base.html" %}
{% load static i18n %}
{% block title %}{% trans "تم تغيير كلمة السر" %} — {{ site_name }}{% endblock %}
{% block content %}
<div class="auth-shell text-center">
  <div class="card auth-card p-8">
    <div class="empty-state-icon" style="background:var(--brand-green-soft); color:var(--brand-green); width:4.5rem; height:4.5rem;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg>
    </div>
    <h1 class="auth-title mt-3">{% trans "تم تغيير كلمة السر" %}</h1>
    <a href="{% url 'accounts:profile' %}" class="btn btn-gold btn-block mt-5">{% trans "العودة لصفحتي" %}</a>
  </div>
</div>
{% endblock %}
