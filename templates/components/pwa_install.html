{% load i18n %}
{# رسالة «ثبّت التطبيق» — بـ JavaScript عادي (مش Alpine) عشان تشتغل حتى لو Alpine اتعطّل #}
<div id="pwa-install" class="pwa-install fixed z-40 hidden" style="bottom: calc(var(--bottom-nav-h) + var(--safe-bottom) + 4.6rem); inset-inline-start: .9rem;" role="complementary" aria-label="{% trans 'ثبّت التطبيق' %}">
  <div class="flex items-center gap-1 card shadow-xl pe-1 ps-3 py-1.5" style="background: var(--brand-navy); color: #fff;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    <button type="button" id="pwa-install-btn" class="text-[11px] font-extrabold py-2">{% trans "ثبّت التطبيق على شاشتك" %}</button>
    <button type="button" id="pwa-install-close" class="p-1.5 text-white/60 hover:text-white" aria-label="{% trans 'إغلاق' %}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</div>
<script>
  (function () {
    var box = document.getElementById('pwa-install');
    var btn = document.getElementById('pwa-install-btn');
    var close = document.getElementById('pwa-install-close');
    if (!box) return;

    var hidden = false;
    try { hidden = localStorage.getItem('pwa-hidden') === '1'; } catch (e) { hidden = false; }

    function hide() {
      box.classList.add('hidden');
      try { localStorage.setItem('pwa-hidden', '1'); } catch (e) {}
    }

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaDeferred = e;
      if (!hidden) box.classList.remove('hidden');
    });

    if (btn) {
      btn.addEventListener('click', function () {
        var e = window.__pwaDeferred;
        if (!e) { hide(); return; }
        e.prompt();
        if (e.userChoice) {
          e.userChoice.then(function (choice) {
            if (choice && choice.outcome === 'accepted') hide();
          });
        }
      });
    }
    if (close) close.addEventListener('click', hide);

    // زر إغلاق إضافي بـ Esc + إخفاء تلقائي بعد ٢٠ ثانية (عشان ما تقفشش على المحتوى)
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hide(); });
    setTimeout(function () { if (!box.classList.contains('hidden')) hide(); }, 20000);
  })();
</script>
